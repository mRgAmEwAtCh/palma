name: palma

services:
  palma:
    build: .
    image: palma:latest
    container_name: palma
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    env_file: .env
    volumes:
      - ./data:/data
      - ./playbooks:/playbooks
      - ${SSH_KEY_DIR:-./ssh}:/ssh-keys:ro
