name: palma

services:
  palma:
    image: ghcr.io/mrgamewatch/palma:latest
    container_name: palma
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - ./playbooks:/playbooks
      - ${SSH_KEY_DIR:-./ssh}:/home/app/.ssh
