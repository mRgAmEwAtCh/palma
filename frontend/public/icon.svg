<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="pa-ink" gradientUnits="userSpaceOnUse" x1="80" y1="80" x2="432" y2="432">
      <stop offset="0" stop-color="#f4a63c"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <!-- gear silhouette: body + 8 teeth, hollow centre -->
    <mask id="pa-gear" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g fill="#fff">
        <circle cx="256" cy="256" r="156"/>
        <rect id="pa-tooth" x="226" y="62" width="60" height="70" rx="14"/>
        <use href="#pa-tooth" transform="rotate(45 256 256)"/>
        <use href="#pa-tooth" transform="rotate(90 256 256)"/>
        <use href="#pa-tooth" transform="rotate(135 256 256)"/>
        <use href="#pa-tooth" transform="rotate(180 256 256)"/>
        <use href="#pa-tooth" transform="rotate(225 256 256)"/>
        <use href="#pa-tooth" transform="rotate(270 256 256)"/>
        <use href="#pa-tooth" transform="rotate(315 256 256)"/>
      </g>
      <circle cx="256" cy="256" r="116" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#pa-bg)"/>
  <!-- gear = maintenance -->
  <rect width="512" height="512" fill="url(#pa-ink)" mask="url(#pa-gear)"/>
  <!-- crosshair = keeping an eye on the hosts -->
  <g stroke="#ececec" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="148" x2="256" y2="172"/>
    <line x1="256" y1="340" x2="256" y2="364"/>
    <line x1="148" y1="256" x2="172" y2="256"/>
    <line x1="340" y1="256" x2="364" y2="256"/>
  </g>
  <!-- play = Ansible plays -->
  <path d="M234 210 L234 302 Q234 314 244 308 L314 263 Q324 256 314 249 L244 204 Q234 198 234 210 Z" fill="#ececec"/>
</svg>
