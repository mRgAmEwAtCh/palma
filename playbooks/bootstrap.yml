---
# Installs Python 3 on fresh hosts (e.g. minimal Alpine/Debian LXCs) so Ansible modules can run.
# Uses raw commands only. Run this first on any host where "Ping & gather facts" fails with a Python error.

- name: Bootstrap Python for Ansible
  hosts: all
  gather_facts: false
  become: "{{ ansible_user != 'root' }}"

  tasks:
    - name: Install python3 if missing
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          echo "python3 already present"
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 && echo "INSTALLED"
        elif command -v apt-get >/dev/null 2>&1; then
          DEBIAN_FRONTEND=noninteractive apt-get update -qq && \
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 && echo "INSTALLED"
        else
          echo "Unsupported package manager" >&2; exit 1
        fi
      register: bootstrap
      changed_when: "'INSTALLED' in bootstrap.stdout"

    - name: Verify facts can be gathered
      ansible.builtin.setup:
        gather_subset: [min]
